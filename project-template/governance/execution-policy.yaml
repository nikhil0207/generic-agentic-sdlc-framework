version: 1.0.0
precedence:
  - FRAMEWORK_HARD_GOVERNANCE
  - CURRENT_HUMAN_INSTRUCTION
  - PROJECT_GUARDRAILS
  - APPROVED_ARCHITECTURE
  - EXPLICIT_CODING_STANDARDS
  - ACCEPTANCE_CRITERIA
  - REPOSITORY_CONVENTIONS
  - FRAMEWORK_DEFAULTS
  - AGENT_PREFERENCE
hard_gates:
  - PRODUCTION_DEPLOYMENT
  - DATABASE_SCHEMA_CHANGE
  - SECURITY_SIGNIFICANT_CHANGE
  - FAILED_MANDATORY_TEST
  - MATERIAL_SCOPE_CHANGE
  - INSUFFICIENT_EVIDENCE
  - ARCHITECTURAL_UNCERTAINTY
  - BLOCKED_RESULT
modes:
  MANUAL: {honor_hard_gates: true, approval: EACH_GOVERNED_PHASE}
  HYBRID: {honor_hard_gates: true, approval: PROJECT_CONFIGURED_PLUS_HARD_GATES}
  AUTONOMOUS: {honor_hard_gates: true, approval: HARD_GATES}
